          <button class="scaleButton" onclick="setScale([0,1,3,5,6,8,10])">Locrian</button>

          <button class="scaleButton" onclick="setScale([0,3,4,6,7,9,11])">Lydian #2</button>
          <button class="scaleButton" onclick="setScale([0,1,3,4,6,8,9])">Super Locrian bb7</button>
        </div>
        <br>
        <h2>Melodic minor modes</h2>
        <div class="container">
          <button class="scaleButton" onclick="setScale([0,2,3,5,7,9,11])">Dorian #7 (Melodic Minor)</button>
          <button class="scaleButton" onclick="setScale([0,1,3,5,7,9,10])">Dorian b2</button>
          <button class="scaleButton" onclick="setScale([0,2,4,6,8,9,11])">Lydian #5</button>
          <button class="scaleButton" onclick="setScale([0,2,4,6,7,9,10])">Lydian b7</button>
          <button class="scaleButton" onclick="setScale([0,2,4,5,7,8,10])">Mixolydian b6</button>

          <button class="scaleButton" onclick="setScale([0,1,3,4,6,8,10])">Altered</button>
        </div>
